<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#E4EAF2"/>
    </pattern>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B1220" flood-opacity="0.07"/>
    </filter>
    <filter id="cardLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0B1220" flood-opacity="0.08"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#64748B"/>
    </marker>
    <marker id="arwMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#A9B4C2"/>
    </marker>

    <g id="ic-browser"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M3 9.5h18"/><circle cx="6.3" cy="7" r="0.9" fill="currentColor" stroke="none"/><circle cx="9.1" cy="7" r="0.9" fill="currentColor" stroke="none"/></g>
    <g id="ic-cloud"><path d="M7 18.5a4.5 4.5 0 01-.3-9 6.2 6.2 0 0111.8 1.6A3.9 3.9 0 0117.6 18.5z"/></g>
    <g id="ic-box"><path d="M12 3.2l8.2 4.6v8.4L12 20.8l-8.2-4.6V7.8z"/><path d="M3.8 7.8L12 12.4l8.2-4.6"/><path d="M12 12.4v8.4"/></g>
    <g id="ic-server"><rect x="3.2" y="4.5" width="17.6" height="6.4" rx="2"/><rect x="3.2" y="13.1" width="17.6" height="6.4" rx="2"/><circle cx="7" cy="7.7" r="0.9" fill="currentColor" stroke="none"/><circle cx="7" cy="16.3" r="0.9" fill="currentColor" stroke="none"/></g>
    <g id="ic-db"><ellipse cx="12" cy="6.2" rx="7.8" ry="3"/><path d="M4.2 6.2v11.6c0 1.66 3.5 3 7.8 3s7.8-1.34 7.8-3V6.2"/><path d="M19.8 12c0 1.66-3.5 3-7.8 3s-7.8-1.34-7.8-3"/></g>
    <g id="ic-layers"><path d="M12 3.4l8.4 4.6-8.4 4.6-8.4-4.6z"/><path d="M3.6 13l8.4 4.6 8.4-4.6"/></g>
    <g id="ic-gauge"><path d="M4.4 17.5a8.4 8.4 0 1115.2 0"/><path d="M12 16.2l3.6-4.4"/><circle cx="12" cy="16.6" r="1.2" fill="currentColor" stroke="none"/></g>
    <g id="ic-tools"><path d="M4.5 7.5h15"/><path d="M4.5 12h15"/><path d="M4.5 16.5h15"/><circle cx="9" cy="7.5" r="2" fill="#FFFFFF"/><circle cx="15" cy="12" r="2" fill="#FFFFFF"/><circle cx="8" cy="16.5" r="2" fill="#FFFFFF"/></g>
  </defs>

  <style>
    .ic { fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .t  { fill: #0B1220; }
    .m  { fill: #64748B; }
    .mm { fill: #94A3B8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 11px; fill: #64748B; paint-order: stroke; stroke: #F7F9FC; stroke-width: 3.5px; stroke-linejoin: round; }
    .lblMuted { font-size: 11px; fill: #9AA6B4; paint-order: stroke; stroke: #F7F9FC; stroke-width: 3.5px; stroke-linejoin: round; }
    .ln { stroke: #64748B; stroke-width: 1.6; }
    .lnMuted { stroke: #A9B4C2; stroke-width: 1.6; stroke-dasharray: 6 4.5; }
  </style>

  <rect width="1600" height="1000" fill="#F7F9FC"/>
  <rect width="1600" height="1000" fill="url(#dots)" opacity="0.55"/>

  <!-- header -->
  <text x="56" y="64" font-size="30" font-weight="700" letter-spacing="-0.5" class="t">Albion Platform — architecture</text>
  <text x="56" y="92" font-size="14" class="m">AO-MarketPlace monorepo · the website reads our own database; only the worker side ever talks to Albion</text>
  <rect x="1400" y="42" width="144" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1472" y="62" font-size="12" class="m" text-anchor="middle">18 Sep 2026</text>

  <!-- band labels -->
  <rect x="416" y="126" width="236" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="534" y="143.5" font-size="11" font-weight="600" letter-spacing="0.7" fill="#0F766E" text-anchor="middle">READ PATH · WHAT VISITORS SEE</text>
  <rect x="948" y="126" width="236" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1066" y="143.5" font-size="11" font-weight="600" letter-spacing="0.7" fill="#B45309" text-anchor="middle">WRITE PATH · HOW DATA GETS IN</text>

  <!-- browser -->
  <g filter="url(#card)">
    <rect x="308" y="160" width="452" height="66" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="324" y="176" width="34" height="34" rx="9" fill="#F1F5F9"/>
  <use href="#ic-browser" class="ic" x="331" y="183" width="20" height="20" color="#475569" stroke="#475569"/>
  <text x="372" y="189" font-size="15.5" font-weight="700" class="t">Browser</text>
  <text x="372" y="209" font-size="12" class="m">a visitor opens a player or alliance profile</text>

  <!-- albion api -->
  <g filter="url(#card)">
    <rect x="840" y="160" width="452" height="66" rx="12" fill="#FEF6E7" stroke="#F2C063"/>
  </g>
  <rect x="856" y="176" width="34" height="34" rx="9" fill="#FDECC8"/>
  <use href="#ic-cloud" class="ic" x="863" y="183" width="20" height="20" color="#B45309" stroke="#B45309"/>
  <text x="904" y="189" font-size="15.5" font-weight="700" class="t">Albion Online public API</text>
  <text x="904" y="209" font-size="12" fill="#92400E">gameinfo · west, europe, east  +  item render service</text>

  <!-- packages/ui -->
  <g filter="url(#card)">
    <rect x="56" y="268" width="220" height="132" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="72" y="286" width="34" height="34" rx="9" fill="#F1F5F9"/>
  <use href="#ic-layers" class="ic" x="79" y="293" width="20" height="20" color="#475569" stroke="#475569"/>
  <text x="116" y="307" font-size="13.5" font-weight="700" class="t">packages/ui</text>
  <text x="72" y="340" font-size="11.5" class="m">PlayerHeader · GuildTable</text>
  <text x="72" y="358" font-size="11.5" class="m">KillEventTable · StatCard</text>
  <text x="72" y="376" font-size="11.5" class="m">Badge · StarRating · EmptyState</text>
  <text x="72" y="392" font-size="10.5" class="mm">React 19 + Tailwind classes</text>

  <!-- packages/rating-engine -->
  <rect x="56" y="412" width="220" height="88" rx="12" fill="#FAFBFC" stroke="#B6C0CC" stroke-dasharray="7 5"/>
  <text x="72" y="436" font-size="13.5" font-weight="700" fill="#475569">packages/rating-engine</text>
  <text x="72" y="457" font-size="11.5" class="m">pure computation, no I/O</text>
  <text x="72" y="475" font-size="11.5" class="m">fame → rating + stars</text>
  <text x="72" y="492" font-size="10.5" class="mm">placeholder today</text>

  <!-- apps/web -->
  <g filter="url(#cardLg)">
    <rect x="308" y="268" width="452" height="232" rx="14" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.5"/>
  </g>
  <rect x="326" y="286" width="34" height="34" rx="9" fill="#E6FFFA"/>
  <use href="#ic-browser" class="ic" x="333" y="293" width="20" height="20" color="#0F766E" stroke="#0F766E"/>
  <text x="372" y="309" font-size="16" font-weight="700" class="t">apps/web</text>
  <rect x="452" y="292" width="86" height="21" rx="10.5" fill="#E6FFFA" stroke="#5EEAD4"/>
  <text x="495" y="306.5" font-size="11" font-weight="600" fill="#0F766E" text-anchor="middle">Next.js 15</text>
  <text x="326" y="336" font-size="12" class="m">async server components · Tailwind 4 · no API routes</text>
  <rect x="326" y="348" width="416" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="342" y="369.5" font-size="13" class="mono t">/players/[playerId]</text>
  <rect x="326" y="390" width="416" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="342" y="411.5" font-size="13" class="mono t">/alliances/[allianceId]</text>
  <rect x="326" y="432" width="416" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="342" y="453.5" font-size="13" class="mono t">/dev/ui — component preview</text>
  <text x="326" y="484" font-size="11" class="mm">each page calls one query function, then renders shared components</text>

  <!-- packages/albion-client -->
  <g filter="url(#card)">
    <rect x="840" y="268" width="452" height="104" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="858" y="286" width="34" height="34" rx="9" fill="#FDECC8"/>
  <use href="#ic-box" class="ic" x="865" y="293" width="20" height="20" color="#B45309" stroke="#B45309"/>
  <text x="904" y="309" font-size="15" font-weight="700" class="t">packages/albion-client</text>
  <rect x="1210" y="292" width="64" height="21" rx="10.5" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1242" y="306.5" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">built</text>
  <text x="858" y="337" font-size="12" class="m">typed SDK for west · europe · east, parsed field by field</text>
  <text x="858" y="356" font-size="12" class="m">AlbionApiError carries the HTTP status and url</text>

  <!-- apps/worker -->
  <rect x="840" y="396" width="452" height="104" rx="12" fill="#FAFBFC" stroke="#B6C0CC" stroke-dasharray="7 5"/>
  <rect x="858" y="414" width="34" height="34" rx="9" fill="#F1F5F9"/>
  <use href="#ic-server" class="ic" x="865" y="421" width="20" height="20" color="#64748B" stroke="#64748B"/>
  <text x="904" y="437" font-size="15" font-weight="700" fill="#475569">apps/worker</text>
  <rect x="1196" y="420" width="78" height="21" rx="10.5" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="1235" y="434.5" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">planned</text>
  <text x="858" y="465" font-size="12" class="m">scheduled import of players, guilds and kill events</text>
  <text x="858" y="484" font-size="12" class="m">Epic 4 · empty placeholder today</text>

  <!-- shared setup -->
  <g filter="url(#card)">
    <rect x="1324" y="268" width="220" height="232" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="1340" y="286" width="34" height="34" rx="9" fill="#F1F5F9"/>
  <use href="#ic-tools" class="ic" x="1347" y="293" width="20" height="20" color="#475569" stroke="#475569"/>
  <text x="1384" y="307" font-size="13.5" font-weight="700" class="t">Shared setup</text>
  <circle cx="1346" cy="335" r="2" fill="#CBD5E1"/><text x="1358" y="339" font-size="11.5" class="m">typescript-config</text>
  <circle cx="1346" cy="355" r="2" fill="#CBD5E1"/><text x="1358" y="359" font-size="11.5" class="m">eslint-config</text>
  <circle cx="1346" cy="375" r="2" fill="#CBD5E1"/><text x="1358" y="379" font-size="11.5" class="m">pnpm workspaces</text>
  <circle cx="1346" cy="395" r="2" fill="#CBD5E1"/><text x="1358" y="399" font-size="11.5" class="m">Turborepo tasks</text>
  <line x1="1340" y1="418" x2="1528" y2="418" stroke="#EEF2F7"/>
  <text x="1340" y="442" font-size="12" font-weight="700" class="t">GitHub Actions CI</text>
  <text x="1340" y="461" font-size="11.5" class="m">build · typecheck · lint</text>
  <text x="1340" y="486" font-size="10.5" class="mm">no tests · no deploy target yet</text>

  <!-- packages/db -->
  <g filter="url(#cardLg)">
    <rect x="308" y="560" width="984" height="108" rx="14" fill="#EEF0FE" stroke="#A5B4FC" stroke-width="1.5"/>
  </g>
  <rect x="330" y="582" width="34" height="34" rx="9" fill="#E0E7FF"/>
  <use href="#ic-box" class="ic" x="337" y="589" width="20" height="20" color="#4F46E5" stroke="#4F46E5"/>
  <text x="376" y="605" font-size="16.5" font-weight="700" class="t">packages/db</text>
  <rect x="502" y="588" width="216" height="23" rx="11.5" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="610" y="603.5" font-size="11.5" font-weight="600" fill="#4338CA" text-anchor="middle">the only door to the database</text>
  <text x="330" y="634" font-size="12.5" fill="#4B5563">Prisma client cached on globalThis · getPlayerById() · getAllianceById() · BigInt fame returned as strings</text>
  <text x="330" y="655" font-size="12.5" fill="#4B5563">migrations in prisma/migrations · seed.ts loads alliances → guilds → players → kill events</text>

  <!-- postgres -->
  <g filter="url(#cardLg)">
    <rect x="308" y="716" width="984" height="184" rx="14" fill="#E6F4FD" stroke="#7CC5EE" stroke-width="1.5"/>
  </g>
  <rect x="330" y="738" width="34" height="34" rx="9" fill="#CFE9FB"/>
  <use href="#ic-db" class="ic" x="337" y="745" width="20" height="20" color="#0369A1" stroke="#0369A1"/>
  <text x="376" y="761" font-size="16.5" font-weight="700" class="t">PostgreSQL (Neon)</text>
  <text x="330" y="792" font-size="12.5" fill="#0C4A6E">DATABASE_URL — pooled, used at runtime        ·        DIRECT_URL — direct, used by Prisma Migrate</text>
  <rect x="330" y="808" width="160" height="40" rx="10" fill="#FFFFFF" stroke="#7CC5EE"/>
  <text x="410" y="833" font-size="13" font-weight="600" class="t" text-anchor="middle">Player</text>
  <rect x="506" y="808" width="170" height="40" rx="10" fill="#FFFFFF" stroke="#7CC5EE"/>
  <text x="591" y="833" font-size="13" font-weight="600" class="t" text-anchor="middle">KillEvent</text>
  <rect x="692" y="808" width="150" height="40" rx="10" fill="#FFFFFF" stroke="#9EC9E4" stroke-dasharray="6 4"/>
  <text x="767" y="833" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Guild *</text>
  <rect x="858" y="808" width="160" height="40" rx="10" fill="#FFFFFF" stroke="#9EC9E4" stroke-dasharray="6 4"/>
  <text x="938" y="833" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Alliance *</text>
  <rect x="1034" y="808" width="236" height="40" rx="10" fill="#FFFFFF" stroke="#9EC9E4" stroke-dasharray="6 4"/>
  <text x="1152" y="833" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">GuildMembership **</text>
  <text x="330" y="875" font-size="11" fill="#0C4A6E">*  branch feat/guild_alliance_dbSchema          **  branch feat/guild_member_history          — neither is merged into main yet</text>

  <!-- arrows -->
  <line class="ln" x1="534" y1="226" x2="534" y2="266" marker-end="url(#arw)"/>
  <text x="548" y="251" class="lbl">HTTP request</text>

  <line class="ln" x1="1066" y1="226" x2="1066" y2="266" marker-end="url(#arw)"/>
  <text x="1080" y="251" class="lbl">JSON</text>

  <line class="lnMuted" x1="1066" y1="372" x2="1066" y2="394" marker-end="url(#arwMuted)"/>

  <line class="ln" x1="306" y1="326" x2="280" y2="326" marker-end="url(#arw)"/>
  <text x="293" y="316" class="lbl" text-anchor="middle">uses</text>

  <line class="lnMuted" x1="306" y1="456" x2="280" y2="456" marker-end="url(#arwMuted)"/>
  <text x="293" y="446" class="lblMuted" text-anchor="middle">uses</text>

  <line class="ln" x1="534" y1="500" x2="534" y2="558" marker-end="url(#arw)"/>
  <text x="548" y="534" class="lbl">read</text>

  <line class="lnMuted" x1="1066" y1="500" x2="1066" y2="558" marker-end="url(#arwMuted)"/>
  <text x="1080" y="534" class="lblMuted">upsert</text>

  <line class="ln" x1="800" y1="668" x2="800" y2="714" marker-end="url(#arw)"/>
  <text x="814" y="696" class="lbl">Prisma</text>

  <!-- legend -->
  <rect x="308" y="928" width="984" height="54" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <line x1="330" y1="948" x2="370" y2="948" stroke="#64748B" stroke-width="1.6"/>
  <text x="380" y="952" font-size="11.5" fill="#475569">built and working today</text>
  <line x1="566" y1="948" x2="606" y2="948" stroke="#A9B4C2" stroke-width="1.6" stroke-dasharray="6 4.5"/>
  <text x="616" y="952" font-size="11.5" fill="#475569">planned, or on a branch not merged into main</text>
  <text x="330" y="972" font-size="11.5" class="m">Dependency rule: apps import packages · packages never import apps · packages ship TypeScript source, compiled by apps/web through transpilePackages</text>
</svg>
